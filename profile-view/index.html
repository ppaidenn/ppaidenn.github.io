<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>paiden.com</title>
  <meta name="description" content="View a friend's profile on paiden.com">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link rel="stylesheet" href="/account-menu.css">
  <style>
    :root {
      --side-margin: 10vw;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --brand-font-size: 2.5vw;
      --nav-font-size: 1.2vw;
      --spacing-small: 0.5vw;
      --spacing-large: 1.5vw;
      --footer-padding: 7vh;
      --footer-title-font-size: 2vw;
      --footer-subtitle-font-size: 1vw;
      --footer-nav-font-size: 1vw;
      --footer-nav-left: 15vw;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0e0e0;
      color: #111;
      overflow-x: hidden;
    }
    .top-nav {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      background: #000;
      color: #fff;
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .top-nav-inner {
      margin: 0 var(--side-margin);
      min-height: calc(64px + var(--safe-top));
      padding-top: var(--safe-top);
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
    }
    .brand {
      color: #fff;
      text-decoration: none;
      font-size: var(--brand-font-size);
      font-weight: bold;
      padding-bottom: var(--spacing-small);
      padding-right: var(--spacing-large);
      border-right: 0.1vw solid #fff;
      margin-right: var(--spacing-large);
    }
    .nav-links { display: flex; align-items: flex-end; gap: 0; }
    .nav-links a {
      color: #fff;
      text-decoration: none;
      font-size: var(--nav-font-size);
      font-weight: bold;
      margin-right: var(--spacing-large);
      padding-bottom: var(--spacing-small);
      opacity: 1;
    }
    .nav-links a:last-child { margin-right: 0; }
    .mobile-fixed-header { display: none; }
    .content-wrap {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: clamp(24px, 4.5vh, 42px) 0 calc(30px + var(--safe-bottom));
      min-height: calc(100vh - 320px);
    }
    .content-inner {
      width: min(1280px, calc(100vw - (2 * var(--side-margin))));
      margin: 0 auto;
      background: rgba(255,255,255,0.75);
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 22px;
      box-shadow: 0 10px 34px rgba(0,0,0,0.08);
      padding: clamp(18px, 2.2vw, 32px);
    }
    .profile-main {
      display: grid;
      grid-template-columns: minmax(320px, 0.94fr) minmax(420px, 1.06fr);
      gap: 20px;
      align-items: start;
    }
    .profile-left-col,
    .profile-right-col {
      min-width: 0;
      display: grid;
      align-content: start;
    }
    .profile-panel {
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 18px;
      background: rgba(255,255,255,0.58);
      padding: clamp(16px, 1.8vw, 24px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }
    .kicker {
      letter-spacing: 0.18em;
      font-size: 12px;
      font-weight: 800;
      color: rgba(16,21,28,0.65);
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 3.8vw, 48px); }
    .profile-name-main {
      margin: 0 0 6px;
      font-size: clamp(30px, 3.8vw, 48px);
      line-height: 1.04;
      font-weight: 800;
      color: #111;
    }
    .profile-name-sub {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 700;
      color: rgba(17,17,17,0.68);
    }
    .profile-top {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 18px;
      margin-bottom: 16px;
      align-items: start;
    }
    .profile-avatar-col {
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .avatar-wrap {
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    .avatar-wrap img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.12);
      display: block;
    }
    .row {
      margin: 0 0 10px;
      font-size: 15px;
    }
    .label { font-weight: 800; }
    .readonly-box {
      width: 100%;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      background: rgba(255,255,255,0.8);
      min-height: 110px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .profile-links-box {
      margin-top: 12px;
      width: 100%;
      border: 1px solid rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 12px;
      background: rgba(255,255,255,0.8);
    }
    .profile-links-list {
      display: grid;
      gap: 8px;
    }
    .profile-link-item {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      max-width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(17,17,17,0.06);
      color: #111;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .profile-link-item:hover {
      background: rgba(17,17,17,0.12);
    }
    .profile-links-empty {
      color: rgba(17,17,17,0.68);
      font-size: 14px;
      font-weight: 700;
    }
    .profile-posts-wrap {
      margin-top: 14px;
      max-width: 100%;
    }
    .profile-posts-list {
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 12px;
      background: rgba(255,255,255,0.9);
      max-height: 360px;
      overflow-y: auto;
      padding: 6px;
    }
    .profile-post-row {
      display: grid;
      gap: 6px;
      padding: 10px;
      border-radius: 9px;
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.06);
    }
    .profile-post-row + .profile-post-row {
      margin-top: 6px;
    }
    .profile-post-title {
      font-size: 13px;
      font-weight: 800;
      color: #111;
      line-height: 1.25;
    }
    .profile-post-meta {
      font-size: 11px;
      font-weight: 700;
      color: rgba(17,17,17,0.58);
    }
    .profile-post-body {
      font-size: 12px;
      line-height: 1.4;
      color: rgba(17,17,17,0.82);
      white-space: pre-line;
    }
    .profile-post-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      border: 1px solid rgba(0,0,0,0.18);
      background: #111;
      color: #fff;
      border-radius: 8px;
      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;
      text-decoration: none;
    }
    .btn {
      border: 1px solid rgba(0,0,0,0.2);
      background: #111;
      color: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    .profile-action-btn {
      width: 100%;
    }
    .status { margin-top: 12px; min-height: 20px; font-weight: 700; }
    .calendar-wrap {
      margin-top: 0;
      border: 1px solid rgba(0,0,0,0.14);
      border-radius: 14px;
      background: rgba(255,255,255,0.88);
      padding: 12px;
    }
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .calendar-month {
      font-size: 16px;
      font-weight: 800;
      color: #111;
    }
    .calendar-nav-btn {
      border: 1px solid rgba(0,0,0,0.2);
      background: #111;
      color: #fff;
      border-radius: 9px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .calendar-weekdays,
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }
    .calendar-weekday {
      font-size: 11px;
      font-weight: 800;
      color: rgba(17,17,17,0.65);
      text-align: center;
      padding: 2px 0;
    }
    .calendar-day {
      border: 1px solid rgba(0,0,0,0.13);
      border-radius: 10px;
      min-height: 62px;
      background: #fff;
      padding: 6px;
      text-align: left;
      cursor: pointer;
      position: relative;
    }
    .calendar-day.muted { opacity: 0.42; }
    .calendar-day.selected {
      border-color: #111;
      box-shadow: 0 0 0 1px #111 inset;
    }
    .calendar-day-num {
      font-size: 12px;
      font-weight: 800;
      color: #111;
    }
    .calendar-day-dots {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .calendar-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111;
    }
    .calendar-events-list {
      margin-top: 10px;
      border: 1px solid rgba(0,0,0,0.12);
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      max-height: 220px;
      overflow-y: auto;
      padding: 6px;
    }
    .calendar-event-row {
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.35;
      border: 1px solid rgba(0,0,0,0.08);
      background: #fff;
      margin-bottom: 6px;
    }
    .calendar-event-row:last-child { margin-bottom: 0; }
    .calendar-note {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 700;
      color: rgba(17,17,17,0.72);
    }
    .request-empty {
      padding: 10px;
      font-size: 14px;
      font-weight: 700;
      color: rgba(17,17,17,0.72);
    }
    .footer {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      background-color: #000;
      padding: var(--footer-padding) 0;
      position: relative;
    }
    .footer-inner {
      margin: 0 var(--side-margin);
      text-align: left;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .footer-left { display: flex; flex-direction: column; align-items: flex-start; }
    .footer-left .footer-brand { font-size: var(--footer-title-font-size); font-weight: bold; color: white; text-decoration: none; margin-bottom: 0.75vw; }
    .footer-left .footer-created, .footer-left .footer-updated { font-size: var(--footer-subtitle-font-size); color: white; margin-top: var(--spacing-small); }
    .footer-nav { position: absolute; top: 50%; left: var(--footer-nav-left); transform: translateY(-45%); display: flex; flex-direction: column; align-items: flex-start; }
    .footer-nav a { font-size: var(--footer-nav-font-size); color: white; text-decoration: none; margin-bottom: var(--spacing-small); }
    .footer-nav a:hover { text-decoration: underline; }
    .footer-social { display: flex; flex-direction: column; align-items: flex-end; color: white; }
    .footer-social .follow-text { font-size: var(--footer-nav-font-size); font-weight: bold; margin-bottom: var(--spacing-small); }
    .social-icons { display: flex; gap: 1vw; }
    .social-icons a { color: white; font-size: 2vw; text-decoration: none; }
    @media (max-width: 768px) {
      body { padding-top: calc(var(--safe-top) + 58px); }
      .top-nav { display: none; }
      .mobile-fixed-header {
        position: fixed; top: 0; left: 0; right: 0;
        height: calc(var(--safe-top) + 58px);
        padding-top: var(--safe-top);
        padding-left: 5vw; padding-right: 5vw;
        display: flex; align-items: center; justify-content: space-between;
        background: #000; z-index: 10000;
      }
      .mobile-fixed-brand { color: #fff; text-decoration: none; font-weight: 800; font-size: clamp(22px, 6.4vw, 30px); line-height: 1; }
      .mobile-fixed-nav { display: flex; align-items: center; gap: 18px; padding-left: 16px; }
      .mobile-fixed-nav a { color: #fff; text-decoration: none; font-size: 22px; line-height: 1; }
      .content-inner {
        width: calc(100vw - 10vw);
      }
      .profile-main { grid-template-columns: 1fr; }
      .profile-top { grid-template-columns: 1fr; }
      .footer { display: none !important; }
    }
  </style>
</head>
<body>
  <header class="top-nav" role="navigation" aria-label="Primary site navigation">

      <nav class="nav-links">

      </nav>
    </div>
  </header>
  <div class="mobile-fixed-header" role="navigation" aria-label="Mobile site navigation">
    <a class="mobile-fixed-brand" href="/">paiden.com</a>
    <div class="mobile-fixed-nav">
      <a href="/photos" aria-label="Photos"><i class="fa-solid fa-image" aria-hidden="true"></i></a>

            <div class="profile-top">
              <div class="profile-avatar-col">

                  <img id="friendAvatarImg" alt="Friend profile photo" src="/images/default_pfp.jpg">
                </div>
                <button class="btn profile-action-btn" id="friendActionBtn" type="button">Add Friend</button>
              </div>
              <div>
                <div class="row"><span class="label">Bio:</span></div>

                <div class="calendar-month" id="friendCalendarMonthLabel">Calendar</div>
                <button class="calendar-nav-btn" id="friendCalendarNextMonthBtn" type="button"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
              </div>
              <div class="calendar-weekdays" id="friendCalendarWeekdays"></div>
              <div class="calendar-grid" id="friendCalendarGrid"></div>
              <div class="calendar-events-list" id="friendCalendarEventsList"></div>
              <div class="calendar-note" id="friendCalendarNote"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-left">
        <a class="footer-brand" href="/">paiden.com</a>
        <div class="footer-created">Created by Paiden Nicks</div>
        <div class="footer-updated" id="last-updated"></div>
      </div>
      <div class="footer-nav">
        <a href="/resume">Resume</a>
        <a href="/photos">Photos</a>
        <a href="/blog">Blog</a>
        <a href="/contactme">Contact Me</a>
      </div>
      <div class="footer-social">
        <span class="follow-text">Follow Me</span>
        <div class="social-icons">
          <a href="https://www.linkedin.com/in/paiden" target="_blank" rel="noopener"><i class="fab fa-linkedin-in"></i></a>
          <a href="https://www.instagram.com/paiden_26" target="_blank" rel="noopener"><i class="fab fa-instagram"></i></a>
          <a href="https://snapchat.com/t/m04JWymy" target="_blank" rel="noopener"><i class="fab fa-snapchat"></i></a>
        </div>
      </div>
    </div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="/auth-client.js"></script>
  <script src="/account-menu.js"></script>
  <script>
    const avatarEl = document.getElementById("friendAvatarImg");
    const fullNameEl = document.getElementById("friendFullName");
    const usernameHandleEl = document.getElementById("friendUsernameHandle");
    const bioEl = document.getElementById("friendBio");
    const linksEl = document.getElementById("friendLinks");
    const friendPostsCounterText = document.getElementById("friendPostsCounterText");
    const friendPostsList = document.getElementById("friendPostsList");
    const statusEl = document.getElementById("friendProfileStatus");
    const friendActionBtn = document.getElementById("friendActionBtn");
    const friendCalendarMonthLabel = document.getElementById("friendCalendarMonthLabel");
    const friendCalendarPrevMonthBtn = document.getElementById("friendCalendarPrevMonthBtn");
    const friendCalendarNextMonthBtn = document.getElementById("friendCalendarNextMonthBtn");
    const friendCalendarWeekdays = document.getElementById("friendCalendarWeekdays");
    const friendCalendarGrid = document.getElementById("friendCalendarGrid");
    const friendCalendarEventsList = document.getElementById("friendCalendarEventsList");
    const friendCalendarNote = document.getElementById("friendCalendarNote");
    const DEFAULT_AVATAR = "/images/default_pfp.jpg";
    let viewedUsername = "";
    let viewedUserId = "";
    let actionMode = "signin";
    let friendCalendarMonthDate = new Date();
    friendCalendarMonthDate = new Date(friendCalendarMonthDate.getFullYear(), friendCalendarMonthDate.getMonth(), 1);
    let friendSelectedDayKey = toDateKey(new Date());
    let friendCalendarEvents = [];
    let friendPosts = [];

    function setStatus(message, isError) {
      if (!statusEl) return;
      statusEl.textContent = message || "";
      statusEl.style.color = isError ? "#a10000" : "rgba(17,17,17,0.78)";
    }

    function toDateKey(dateLike) {
      const d = new Date(dateLike);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function monthRange(monthStart) {
      const start = new Date(monthStart.getFullYear(), monthStart.getMonth(), 1, 0, 0, 0, 0);
      const end = new Date(monthStart.getFullYear(), monthStart.getMonth() + 1, 1, 0, 0, 0, 0);
      return { start, end };
    }

    function formatEventTime(iso) {
      try {
        return new Date(iso).toLocaleString([], {
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit",
        });
      } catch (_) {
        return "";
      }
    }

    function escapeHTML(str) {
      return String(str || "").replace(/[&<>"']/g, (s) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[s] || s));
    }

    function normalizeLinkUrl(url) {
      const trimmed = String(url || "").trim();
      if (!trimmed) return "";
      return /^https?:\/\//i.test(trimmed) ? trimmed : `https://${trimmed}`;
    }

    function renderProfileLinks(links) {
      if (!linksEl) return;
      const items = Array.isArray(links) ? links.map((link) => normalizeLinkUrl(link)).filter(Boolean) : [];
      if (!items.length) {
        linksEl.innerHTML = '<div class="profile-links-empty">No links added.</div>';
        return;
      }
      linksEl.innerHTML = items.map((link) => {
        const safeLabel = escapeHTML(link.replace(/^https?:\/\//i, ""));
        const safeHref = escapeHTML(link);
        return `<a class="profile-link-item" href="${safeHref}" target="_blank" rel="noopener noreferrer"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i><span>${safeLabel}</span></a>`;
      }).join("");
    }

    function formatPostDate(iso) {
      try {
        return new Date(iso).toLocaleDateString([], {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      } catch (_) {
        return "";
      }
    }

    function buildPostExcerpt(body) {
      const text = String(body || "").replace(/\s+/g, " ").trim();
      if (!text) return "";
      return text.length > 180 ? `${text.slice(0, 177)}...` : text;
    }

    function renderFriendPosts(rows) {
      if (!friendPostsList) return;
      const list = Array.isArray(rows) ? rows : [];
      if (friendPostsCounterText) friendPostsCounterText.textContent = String(list.length);
      if (!list.length) {
        friendPostsList.innerHTML = '<div class="request-empty">No account-linked blog posts yet.</div>';
        return;
      }
      friendPostsList.innerHTML = list.map((row) => {
        const title = escapeHTML(String(row.title || "Untitled"));
        const excerpt = escapeHTML(buildPostExcerpt(row.body));
        const created = escapeHTML(formatPostDate(row.created_at));
        const postId = encodeURIComponent(String(row.id || "").trim());
        return `
          <div class="profile-post-row">
            <div class="profile-post-title">${title}</div>
            <div class="profile-post-meta">${created}</div>
            <div class="profile-post-body">${excerpt || "No post preview available."}</div>
            <a class="profile-post-link" href="/blog?post=${postId}"><i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i><span>Open on Blog</span></a>
          </div>
        `;
      }).join("");
    }

    async function loadFriendPosts() {
      if (!window.PaidenAuth || typeof window.PaidenAuth.getClient !== "function") return;
      if (!viewedUserId) {
        friendPosts = [];
        renderFriendPosts([]);
        return;
      }
      const client = window.PaidenAuth.getClient();
      const { data, error } = await client
        .from("posts")
        .select("id, title, body, created_at")
        .eq("user_id", viewedUserId)
        .order("created_at", { ascending: false })
        .limit(20);
      if (error) {
        friendPosts = [];
        renderFriendPosts([]);
        return;
      }
      friendPosts = Array.isArray(data) ? data : [];
      renderFriendPosts(friendPosts);
    }

    function renderFriendCalendarWeekdays() {
      if (!friendCalendarWeekdays) return;
      if (friendCalendarWeekdays.dataset.ready === "1") return;
      const labels = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      friendCalendarWeekdays.innerHTML = labels.map((l) => `<div class="calendar-weekday">${l}</div>`).join("");
      friendCalendarWeekdays.dataset.ready = "1";
    }

    function renderFriendSelectedDayEvents() {
      if (!friendCalendarEventsList) return;
      const rows = friendCalendarEvents
        .filter((e) => toDateKey(e.starts_at) === friendSelectedDayKey)
        .sort((a, b) => new Date(a.starts_at).getTime() - new Date(b.starts_at).getTime());

      if (!rows.length) {
        friendCalendarEventsList.innerHTML = '<div class="request-empty">No events for selected day.</div>';
        return;
      }

      friendCalendarEventsList.innerHTML = rows.map((e) => {
        const when = formatEventTime(e.starts_at);
        const where = e.location ? `<br>${escapeHTML(e.location)}` : "";
        return `<div class="calendar-event-row"><strong>${escapeHTML(e.title || "Untitled")}</strong><br>${escapeHTML(when)}${where}</div>`;
      }).join("");
    }

    function renderFriendCalendarGrid() {
      if (!friendCalendarGrid || !friendCalendarMonthLabel) return;
      const monthStart = new Date(friendCalendarMonthDate.getFullYear(), friendCalendarMonthDate.getMonth(), 1);
      friendCalendarMonthLabel.textContent = monthStart.toLocaleDateString([], { month: "long", year: "numeric" });

      const gridStart = new Date(monthStart);
      gridStart.setDate(gridStart.getDate() - gridStart.getDay());

      const cells = [];
      for (let i = 0; i < 42; i += 1) {
        const d = new Date(gridStart);
        d.setDate(gridStart.getDate() + i);
        const key = toDateKey(d);
        const isMuted = d.getMonth() !== monthStart.getMonth();
        const isSelected = key === friendSelectedDayKey;
        const count = friendCalendarEvents.filter((e) => toDateKey(e.starts_at) === key).length;
        const dots = count > 0 ? `<div class="calendar-day-dots">${Array.from({ length: Math.min(count, 5) }).map(() => '<span class="calendar-dot"></span>').join("")}</div>` : "";
        cells.push(`
          <button class="calendar-day ${isMuted ? "muted" : ""} ${isSelected ? "selected" : ""}" data-friend-day-key="${key}" type="button">
            <div class="calendar-day-num">${d.getDate()}</div>
            ${dots}
          </button>
        `);
      }
      friendCalendarGrid.innerHTML = cells.join("");
      renderFriendSelectedDayEvents();
    }

    async function loadFriendCalendarEvents() {
      if (!window.PaidenAuth || typeof window.PaidenAuth.getClient !== "function") return;
      if (!viewedUsername) return;
      const auth = await window.PaidenAuth.getCurrentProfile();
      if (!auth || !auth.ok || !auth.user) {
        friendCalendarEvents = [];
        if (friendCalendarNote) friendCalendarNote.textContent = "Sign in to view account calendars.";
        renderFriendCalendarGrid();
        return;
      }

      const client = window.PaidenAuth.getClient();
      const { start, end } = monthRange(friendCalendarMonthDate);
      const { data, error } = await client.rpc("get_friend_calendar_events", {
        target_username: viewedUsername,
        start_at: start.toISOString(),
        end_at: end.toISOString(),
      });

      if (error) {
        friendCalendarEvents = [];
        if (friendCalendarNote) friendCalendarNote.textContent = "Calendar unavailable.";
        renderFriendCalendarGrid();
        return;
      }

      friendCalendarEvents = Array.isArray(data) ? data : [];
      if (friendCalendarNote) {
        if (actionMode === "add" || actionMode === "requested") {
          friendCalendarNote.textContent = "Calendar is visible after you become friends.";
        } else {
          friendCalendarNote.textContent = friendCalendarEvents.length ? "" : "No upcoming events this month.";
        }
      }
      renderFriendCalendarGrid();
    }

    async function loadFriendProfile() {
      if (!window.PaidenAuth || typeof window.PaidenAuth.getClient !== "function") {
        setStatus("Auth service unavailable.", true);
        return;
      }

      const params = new URLSearchParams(window.location.search || "");
      const username = String(params.get("username") || "").trim();
      if (!username) {
        setStatus("Missing account username.", true);
        return;
      }
      viewedUsername = username;

      const client = window.PaidenAuth.getClient();
      const { data, error } = await client.rpc("get_public_profile_by_username", { target_username: username });
      if (error) {
        setStatus(error.message || "Could not load profile.", true);
        return;
      }

      const profile = Array.isArray(data) ? data[0] : null;
      if (!profile) {
        setStatus("Account not found.", true);
        if (fullNameEl) fullNameEl.textContent = "Account Profile";
        if (usernameHandleEl) usernameHandleEl.textContent = "@unknown";
        if (bioEl) bioEl.textContent = "-";
        renderProfileLinks([]);
        renderFriendPosts([]);
        if (avatarEl) avatarEl.src = DEFAULT_AVATAR;
        if (friendActionBtn) friendActionBtn.style.display = "none";
        return;
      }

      viewedUserId = String(profile.id || "");
      if (fullNameEl) fullNameEl.textContent = String(profile.full_name || profile.username || "Account Profile");
      if (usernameHandleEl) usernameHandleEl.textContent = `@${String(profile.username || "-")}`;
      if (bioEl) bioEl.textContent = String(profile.bio || "No bio set.");
      renderProfileLinks(profile.personal_links);
      if (avatarEl) avatarEl.src = String(profile.avatar_url || "").trim() || DEFAULT_AVATAR;
      const resolvedUsername = String(profile.username || "").trim();
      if (resolvedUsername && (window.location.pathname === "/profile-view" || window.location.pathname === "/profile-view/")) {
        window.history.replaceState({}, "", `/${encodeURIComponent(resolvedUsername)}`);
      }
      await loadFriendActionState();
      await loadFriendPosts();
      await loadFriendCalendarEvents();
    }

    async function loadFriendActionState() {
      if (!friendActionBtn) return;
      if (!window.PaidenAuth || typeof window.PaidenAuth.getClient !== "function") return;
      const auth = await window.PaidenAuth.getCurrentProfile();
      if (!auth || !auth.ok || !auth.user) {
        actionMode = "signin";
        friendActionBtn.disabled = false;
        friendActionBtn.textContent = "Sign In to Add Friend";
        setStatus("Sign in to send a friend request.");
        return;
      }

      const myId = String(auth.user.id || "");
      const myUsername = auth.profile && auth.profile.username ? String(auth.profile.username).trim().toLowerCase() : "";
      if (viewedUserId && myId && viewedUserId === myId || (viewedUsername && viewedUsername.toLowerCase() === myUsername)) {
        actionMode = "self";
        friendActionBtn.disabled = false;
        friendActionBtn.textContent = "View My Profile";
        setStatus("");
        return;
      }

      const client = window.PaidenAuth.getClient();
      const { data: friendsData } = await client.rpc("get_my_friends");
      const isFriend = (Array.isArray(friendsData) ? friendsData : []).some((row) => {
        const key = row && row.username ? String(row.username).trim().toLowerCase() : "";
        return key === viewedUsername.toLowerCase();
      });
      if (isFriend) {
        actionMode = "remove";
        friendActionBtn.disabled = false;
        friendActionBtn.textContent = "Friends";
        setStatus("");
        return;
      }

      const { data: outgoingData } = await client.rpc("get_my_outgoing_friend_requests");
      const isRequested = (Array.isArray(outgoingData) ? outgoingData : []).some((row) => {
        const key = row && row.username ? String(row.username).trim().toLowerCase() : "";
        return key === viewedUsername.toLowerCase();
      });
      if (isRequested) {
        actionMode = "requested";
        friendActionBtn.disabled = true;
        friendActionBtn.textContent = "Requested";
        setStatus("");
        return;
      }

      actionMode = "add";
      friendActionBtn.disabled = false;
      friendActionBtn.textContent = "Add Friend";
      setStatus("");
    }

    if (friendActionBtn) {
      friendActionBtn.addEventListener("click", async () => {
        if (!window.PaidenAuth || typeof window.PaidenAuth.getClient !== "function") return;
        const client = window.PaidenAuth.getClient();
        if (actionMode === "self") {
          window.location.href = "/profile";
          return;
        }
        if (actionMode === "signin") {
          window.location.href = `/signin?next=${encodeURIComponent(window.location.pathname + window.location.search)}`;
          return;
        }
        if (actionMode === "remove") {
          if (!window.confirm(`Remove @${viewedUsername} from your friends?`)) return;
          friendActionBtn.disabled = true;
          friendActionBtn.textContent = "Updating...";
          const { data, error } = await client.rpc("remove_friend_by_username", { target_username: viewedUsername });
          if (error || data === false) {
            friendActionBtn.disabled = false;
            friendActionBtn.textContent = "Friends";
            setStatus((error && error.message) || "Could not remove friend.", true);
            return;
          }
          actionMode = "add";
          friendActionBtn.disabled = false;
          friendActionBtn.textContent = "Add Friend";
          setStatus("Friend removed.");
          await loadFriendCalendarEvents();
          return;
        }
        if (actionMode !== "add") return;
        friendActionBtn.disabled = true;
        friendActionBtn.textContent = "Sending...";
        const { data, error } = await client.rpc("add_friend_by_username", { target_username: viewedUsername });
        if (error || data === false) {
          friendActionBtn.disabled = false;
          friendActionBtn.textContent = "Add Friend";
          setStatus((error && error.message) || "Could not send friend request.", true);
          return;
        }
        if (window.PaidenAuth && typeof window.PaidenAuth.invokeEdgeFunction === "function") {
          const notifyRes = await window.PaidenAuth.invokeEdgeFunction("push-notify", {
            type: "friend_request",
            target_username: viewedUsername,
          }).catch((err) => ({ ok: false, error: err?.message || "Could not trigger friend request notification." }));
          if (!notifyRes || notifyRes.ok === false) {
            console.error("Friend request push-notify failed:", notifyRes?.error || "Unknown error");
          }
        }
        actionMode = "requested";
        friendActionBtn.disabled = true;
        friendActionBtn.textContent = "Requested";
        setStatus("Friend request sent.");
        await loadFriendCalendarEvents();
      });
    }

    if (friendCalendarPrevMonthBtn) {
      friendCalendarPrevMonthBtn.addEventListener("click", async () => {
        friendCalendarMonthDate = new Date(friendCalendarMonthDate.getFullYear(), friendCalendarMonthDate.getMonth() - 1, 1);
        friendSelectedDayKey = toDateKey(friendCalendarMonthDate);
        await loadFriendCalendarEvents();
      });
    }

    if (friendCalendarNextMonthBtn) {
      friendCalendarNextMonthBtn.addEventListener("click", async () => {
        friendCalendarMonthDate = new Date(friendCalendarMonthDate.getFullYear(), friendCalendarMonthDate.getMonth() + 1, 1);
        friendSelectedDayKey = toDateKey(friendCalendarMonthDate);
        await loadFriendCalendarEvents();
      });
    }

    if (friendCalendarGrid) {
      friendCalendarGrid.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-friend-day-key]");
        if (!btn) return;
        friendSelectedDayKey = String(btn.getAttribute("data-friend-day-key") || "");
        renderFriendCalendarGrid();
      });
    }

    const lastUpdated = document.getElementById("last-updated");
    if (lastUpdated) lastUpdated.innerText = "Today's Date: " + new Date().toLocaleDateString();
    renderFriendCalendarWeekdays();
    renderFriendCalendarGrid();
    loadFriendProfile();
  </script>
</body>
</html>
