<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>paiden.com</title>
  <meta name="description" content="Template for Paiden's website pages.">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="apple-touch-icon" href="/images/favicon.png">

  <!-- Font Awesome Kit -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"/>

  <style>
    /* CUSTOM PROPERTIES: Adjust these values to tweak proportions */
    :root {
      --side-margin: 10vw;            /* Responsive horizontal margin */
      --nav-height: 20vh;             /* Height of navigation overlay */
      --slideshow-height: 85vh;       /* Height of the slideshow container */
      --footer-padding: 7vh;          /* Vertical padding for the footer */
      --brand-font-size: 2.5vw;       /* Font size for nav brand (paiden.com) */
      --nav-font-size: 1.2vw;         /* Font size for other nav links */
      --header-font-size: 4vw;        /* Font size for overlay header */
      --subheader-font-size: 1.5vw;   /* Font size for overlay subheader */
      --footer-title-font-size: 2vw;  /* Font size for footer brand/button */
      --footer-subtitle-font-size: 1vw; /* Font size for footer text */
      --footer-button-spacing: 0.75vw; /* Adjustable space between paiden.com and footer text */
      --footer-nav-font-size: 1vw;    /* Font size for footer navigation links */
      --footer-nav-left: 15vw;        /* Adjustable left offset for footer navigation links */
      --spacing-small: 0.5vw;         /* Small vertical spacing */
      --spacing-large: 1.5vw;         /* Larger horizontal spacing */
      --safe-top: env(safe-area-inset-top, 0px);
    }

    /* Global box-sizing and reserve scrollbar space */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      scrollbar-gutter: stable;
    }

    /* Overall page styling using the responsive side margin */
    body {
      margin: 0 var(--side-margin);
      padding: 0;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    /* Full-width slideshow container spanning the entire viewport */
    .slideshow-container {
      position: relative;
      width: 100vw;
      height: calc(var(--slideshow-height) + var(--safe-top));
      padding-top: var(--safe-top);
      margin-left: calc(50% - 50vw);
      overflow: hidden;
    }
    .slideshow-container::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 16vh;
      background: linear-gradient(to bottom, rgba(224,224,224,0), #e0e0e0 90%);
      pointer-events: none;
      z-index: 1;
      display: none;
    }

    /* Navigation overlay spanning full width with gradient shading */
    .nav-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: calc(var(--nav-height) + var(--safe-top));
      background: transparent;
      z-index: 3;
      display: flex;
      align-items: center;
    }
    .nav-overlay::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: var(--safe-top);
      height: var(--nav-height);
      background: linear-gradient(to bottom, rgba(0,0,0,1), rgba(0,0,0,0));
      pointer-events: none;
      z-index: 0;
    }

    /* Inner container for nav buttons, constrained within the responsive side margin */
    .nav-inner {
      width: 100%;
      margin-left: var(--side-margin);
      margin-right: var(--side-margin);
      padding-top: var(--safe-top);
      display: flex;
      align-items: flex-end;
      position: relative;
      z-index: 1;
    }

    /* Styling for the brand button in nav */
    .brand a {
      color: white;
      text-decoration: none;
      font-size: var(--brand-font-size);
      font-weight: bold;
      padding-bottom: var(--spacing-small);
      padding-right: var(--spacing-large);
      border-right: 0.1vw solid white;
      margin-right: var(--spacing-large);
    }

    /* Container for the remaining nav links */
    .nav-items {
      display: flex;
      align-items: flex-end;
    }

    /* Styling for the nav links */
    .nav-items a {
      color: white;
      text-decoration: none;
      margin-right: var(--spacing-large);
      font-size: var(--nav-font-size);
      font-weight: bold;
      padding-bottom: var(--spacing-small);
    }

    .nav-items a:hover {
      text-decoration: underline;
    }

    .mobile-fixed-header { display: none; }

    /* Constant overlay text container with header and sub-header */
    .slideshow-text {
      position: absolute;
      top: calc(65% + (var(--safe-top) * 0.35));
      left: var(--side-margin);
      transform: translateY(-50%);
      color: white;
      text-align: left;
      z-index: 2;
    }

    .slideshow-text h1 {
      margin: 0;
      margin-bottom: var(--spacing-small);
      font-size: var(--header-font-size);
      font-weight: bold;
    }

    .slideshow-text h2 {
      margin: 0;
      font-size: var(--subheader-font-size);
      font-weight: normal;
    }

    /* Slide styling with fade effect */
    .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(50%);
    }

    /* FOOTER STYLING: Full-width background with inner container */
    .footer {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      background-color: #000;
      padding: var(--footer-padding) 0;
      position: relative;
    }

    /* Footer inner container aligning content with responsive margins */
    .footer-inner {
      margin: 0 var(--side-margin);
      text-align: left;
      position: relative;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    /* Footer left column: a vertical stack of texts using proportional variables */
    .footer-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .footer-left .footer-brand {
      font-size: var(--footer-title-font-size);
      font-weight: bold;
      color: white;
      text-decoration: none;
      margin-bottom: var(--footer-button-spacing); /* Adjustable spacing */
    }

    .footer-left .footer-created,
    .footer-left .footer-updated {
      font-size: var(--footer-subtitle-font-size);
      color: white;
      margin-top: var(--spacing-small);
    }

    /* The vertical nav in the footer */
    .footer-nav {
      position: absolute;
      top: 50%;
      left: var(--footer-nav-left);
      transform: translateY(-45%);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .footer-nav a {
      font-size: var(--footer-nav-font-size);
      color: white;
      text-decoration: none;
      margin-bottom: var(--spacing-small);
    }

    .footer-nav a:hover {
      text-decoration: underline;
    }

    /* Social icons section (right aligned) */
    .footer-social {
      display: flex;
      flex-direction: column;
      align-items: flex-end; /* Right alignment */
      color: white;
    }

    .footer-social .follow-text {
      font-size: var(--footer-nav-font-size);
      font-weight: bold;
      margin-bottom: var(--spacing-small);
    }

    .social-icons {
      display: flex;
      gap: 1vw; /* space between icons */
    }

    .social-icons a {
      color: white;
      font-size: 2vw; /* adjust icon size or use a variable */
      transition: transform 0.2s ease;
      text-decoration: none;
    }

    .social-icons a:hover {
      transform: scale(1.1);
    }

    /* PDF section: full-width light gray band with inner content aligned to side margins */
    .pdf-wrap {
      width: 100vw;
      margin-left: calc(50% - 50vw); /* break out to full width */
      background: #e0e0e0;           /* light gray */
      padding: 4vh 0;                /* vertical breathing room */
    }

    .pdf-inner {
      margin: 0 var(--side-margin);  /* match page side margins */
    }

    /* The embedded viewer */
    .pdf-viewer {
      width: 100%;
      height: 90vh;                  /* responsive height */
      border: 0;
      border-radius: 0.8vw;          /* subtle rounding to match modern feel */
      background: #fff;              /* white canvas behind PDF while loading */
      box-shadow: 0 0.6vw 2vw rgba(0,0,0,0.08);
    }

    /* Small action row under the viewer */
    .pdf-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(var(--footer-subtitle-font-size) * 0.9);
      color: #333;
      margin-top: 1rem;
    }
    .pdf-actions a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
    }
    .pdf-actions a:hover {
      text-decoration: underline;
    }

    /* Tweak viewer height on small screens */
    @media (max-width: 600px) {
      .pdf-viewer { height: 75vh; border-radius: 2vw; }
    }

    /* Media query for smaller screens */
    @media (max-width: 600px) {
      :root {
        --side-margin: 5vw;
        --slideshow-height: 46vh;
        --brand-font-size: 4vw;
        --nav-font-size: 3vw;
        --header-font-size: 8.5vw;
        --subheader-font-size: 4.8vw;
        --footer-title-font-size: 4vw;
        --footer-subtitle-font-size: 2vw;
        --footer-nav-font-size: 3vw;
      }
      .nav-inner, .footer-inner {
        margin-left: var(--side-margin);
        margin-right: var(--side-margin);
      }
      .social-icons a {
        font-size: 5vw; /* Larger icons on small screens */
      }
    }

    @media (max-width: 768px) {
      html, body {
        background: #000;
        overscroll-behavior-y: contain;
      }
      body {
        padding-top: calc(env(safe-area-inset-top, 0px) + 58px);
      }
      .mobile-fixed-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(env(safe-area-inset-top, 0px) + 58px);
        padding-top: env(safe-area-inset-top, 0px);
        padding-left: 5vw;
        padding-right: 5vw;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #000;
        z-index: 10000;
      }
      .mobile-fixed-brand {
        color: #fff;
        text-decoration: none;
        font-weight: 800;
        font-size: clamp(22px, 6.4vw, 30px);
        line-height: 1;
      }
      .mobile-fixed-nav {
        display: flex;
        align-items: center;
        gap: 18px;
        padding-left: 16px;
      }
      .mobile-fixed-nav a {
        color: #fff;
        text-decoration: none;
        font-size: 22px;
        line-height: 1;
      }
      a[href="/resume"],
      a[href="/resume/"] {
        display: none !important;
      }
      .nav-overlay { display: none; }
      .slideshow-container {
        padding-top: 0;
        height: var(--slideshow-height);
      }
      .slideshow-container::after {
        display: block;
      }
      .slideshow-text {
        top: 65%;
      }
      .footer {
        display: none !important;
      }
    }

    @media (max-width: 600px) {
      .footer-inner {
        display: grid;
        grid-template-columns: auto auto 1fr;
        column-gap: 4vw;
        align-items: start;
      }
      .footer-left { min-width: 0; }
      .footer-nav {
        position: static;
        top: auto;
        left: auto;
        transform: none;
        margin: 0;
        padding-top: 0.2rem;
      }
      .footer-nav a {
        line-height: 1.25;
        margin-bottom: 0.35rem;
      }
      .footer-social {
        margin-left: auto;
        align-items: flex-end;
      }
    }
  </style>
  <link rel="stylesheet" href="/account-menu.css">
</head>
<body>
  <div class="mobile-fixed-header" role="navigation" aria-label="Mobile site navigation">
    <a class="mobile-fixed-brand" href="/">paiden.com</a>
    <div class="mobile-fixed-nav">
      <a href="/photos" aria-label="Photos"><i class="fa-solid fa-image" aria-hidden="true"></i></a>
      <a href="/blog" aria-label="Blog"><i class="fa-solid fa-comment-dots" aria-hidden="true"></i></a>
      <a href="/contactme" aria-label="Contact Me"><i class="fa-solid fa-envelope" aria-hidden="true"></i></a>
    </div>
  </div>
  <!-- Full-width slideshow container -->
  <div class="slideshow-container">
    <!-- Navigation overlay with gradient shading -->
    <div class="nav-overlay">
      <div class="nav-inner">
        <!-- Brand button in nav -->
        <div class="brand">
          <a href="/">paiden.com</a>
        </div>
        <!-- Navigation buttons -->
        <div class="nav-items">
          <a href="/resume">Resume</a>
          <a href="/photos">Photos</a>
          <a href="/blog">Blog</a>
          <a href="/contactme">Contact Me</a>
        </div>
      </div>
    </div>
    <!-- Constant overlay text -->
    <div class="slideshow-text">
      <h1>My Resume</h1>
      <h2>Last Updated August 2025</h2>
    </div>
    <!-- Slides -->
    <div class="slide active"><img src="images/header/castle.JPG" srcset="images/header/castle-800.webp 800w, images/header/castle-1600.webp 1600w" sizes="100vw" alt="castle" loading="eager" fetchpriority="high" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/lake.JPG" data-srcset="images/header/lake-800.webp 800w, images/header/lake-1600.webp 1600w" data-sizes="100vw" alt="lake" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/avalanche.JPG" data-srcset="images/header/avalanche-800.webp 800w, images/header/avalanche-1600.webp 1600w" data-sizes="100vw" alt="avalanche" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/sistine.JPG" data-srcset="images/header/sistine-800.webp 800w, images/header/sistine-1600.webp 1600w" data-sizes="100vw" alt="sistine" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/falls.JPG" data-srcset="images/header/falls-800.webp 800w, images/header/falls-1600.webp 1600w" data-sizes="100vw" alt="falls" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/swiss.JPG" data-srcset="images/header/swiss-800.webp 800w, images/header/swiss-1600.webp 1600w" data-sizes="100vw" alt="Swiss" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/rocket.JPG" data-srcset="images/header/rocket-800.webp 800w, images/header/rocket-1600.webp 1600w" data-sizes="100vw" alt="Rocket" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/chief_mtn.JPG" data-srcset="images/header/chief_mtn-800.webp 800w, images/header/chief_mtn-1600.webp 1600w" data-sizes="100vw" alt="Chief Mtn" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/land.JPG" data-srcset="images/header/land-800.webp 800w, images/header/land-1600.webp 1600w" data-sizes="100vw" alt="Land" loading="lazy" fetchpriority="low" decoding="async" /></div>
    <div class="slide"><img data-src="images/header/incline.jpg" data-srcset="images/header/incline-800.webp 800w, images/header/incline-1600.webp 1600w" data-sizes="100vw" alt="incline" loading="lazy" fetchpriority="low" decoding="async" /></div>
  </div>
  <!-- PDF Section -->
  <section class="pdf-wrap">
    <div class="pdf-inner">
      <iframe
        class="pdf-viewer"
        src="Resume_2025.pdf"
        title="Embedded PDF"
      ></iframe>

      <div class="pdf-actions">
        <span>Having trouble viewing? Some browsers block inline PDFs.</span>
        <a href="Resume_2025.pdf" target="_blank" rel="noopener">Open in new tab</a>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-inner">
      <!-- Left side: paiden.com, Created by, Last Updated -->
      <div class="footer-left">
        <a class="footer-brand" href="/">paiden.com</a>
        <div class="footer-created">Created by Paiden Nicks</div>
        <div class="footer-updated" id="last-updated"></div>
      </div>

      <!-- Vertical nav in the footer -->
      <div class="footer-nav">
        <a href="/resume">Resume</a>
        <a href="/photos">Photos</a>
        <a href="/blog">Blog</a>
        <a href="/contactme">Contact Me</a>
      </div>

      <!-- Right side: Social Icons -->
      <div class="footer-social">
        <span class="follow-text">Follow Me</span>
        <div class="social-icons">
          <!-- Replace “YourProfile” with your actual username/ID -->
          <a href="https://www.linkedin.com/in/paiden" target="_blank">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="https://www.instagram.com/paiden_26" target="_blank">
            <i class="fab fa-instagram"></i>
          </a>
          <a href="https://snapchat.com/t/m04JWymy" target="_blank">
            <i class="fab fa-snapchat"></i>
          </a>
          </div>
      </div>
    </div>
  </footer>

  <!-- JavaScript to cycle through slides automatically and update footer date -->
  <script>
    const isMobile = window.matchMedia("(max-width: 768px)").matches;
    let slideIndex = 0;
    const slides = document.getElementsByClassName("slide");
    function loadSlideImage(index) {
      const slide = slides[index];
      if (!slide) return;
      const img = slide.querySelector("img");
      if (img && !img.getAttribute("src") && img.dataset.src) {
        if (img.dataset.srcset) {
          img.srcset = img.dataset.srcset;
        }
        if (img.dataset.sizes) {
          img.sizes = img.dataset.sizes;
        }
        img.src = img.dataset.src;
      }
    }
    if (slides.length) {
      loadSlideImage(0);
      if (!isMobile && slides.length > 1) {
        loadSlideImage(1);
      }
    }
    function showSlides() {
      if (isMobile || !slides || slides.length <= 1) return;
      for (let i = 0; i < slides.length; i++) {
        slides[i].classList.remove("active");
      }
      slideIndex++;
      if (slideIndex > slides.length) {
        slideIndex = 1;
      }
      slides[slideIndex - 1].classList.add("active");
      loadSlideImage(slideIndex - 1);
      loadSlideImage(slideIndex % slides.length);
      setTimeout(showSlides, 5000); // Change slide every 5 seconds
    }
    if (!isMobile) showSlides();
    
    // Update footer with the current date
    document.getElementById("last-updated").innerText =
      "Today's Date: " + new Date().toLocaleDateString();
  </script>
  <script src="/notifications.js"></script>
  <script src="/account-menu.js"></script>
</body>
